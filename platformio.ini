; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
;
; Hardware targets (board profile selected by build flag, see src/board.h):
;   esp32dev               upstream "TMC2209 Pen/Laser FluidNC" controller (classic ESP32, 4 MB)
;   mks_dlc32_max          Makerbase MKS DLC32 MAX (ESP32-S3, 8 MB)
;   mks_dlc32_max_bringup  hardware test firmware for the DLC32 MAX (serial report @115200)

[platformio]
default_envs = esp32dev

[env]
platform = espressif32@6.12.0
framework = arduino
board_build.filesystem = littlefs
monitor_filters = esp32_exception_decoder
build_unflags = -std=gnu++11
build_flags = -std=gnu++17

lib_deps =
	https://github.com/tzapu/WiFiManager.git@2.0.17
	https://github.com/ESP32Async/ESPAsyncWebServer.git@^3.7.4
	https://github.com/madhephaestus/ESP32Servo.git@^3.0.9
	https://github.com/adafruit/Adafruit_SSD1306.git@^2.5.13
	https://github.com/teemuatlut/tmcstepper.git@0.7.3+sha.74e8e68
	waspinator/AccelStepper@^1.64
	bblanchon/ArduinoJson@^5.13.4

[env:esp32dev]
board = esp32dev
board_build.partitions = partitions.csv
extra_scripts = build.py, merge_bin.py
build_src_filter = +<*> -<bringup/>

[dlc32_max]
board = esp32-s3-devkitc-1
board_upload.flash_size = 8MB
board_build.flash_size = 8MB
board_build.arduino.memory_type = qio_qspi
; CH340 USB-serial on UART0 (GPIO43/44): keep Serial on the UART, not native USB CDC
build_flags = ${env.build_flags} -DBOARD_MKS_DLC32_MAX -DARDUINO_USB_CDC_ON_BOOT=0

[env:mks_dlc32_max]
board = ${dlc32_max.board}
board_upload.flash_size = ${dlc32_max.board_upload.flash_size}
board_build.flash_size = ${dlc32_max.board_build.flash_size}
board_build.arduino.memory_type = ${dlc32_max.board_build.arduino.memory_type}
board_build.partitions = partitions_8mb.csv
build_flags = ${dlc32_max.build_flags}
extra_scripts = build.py, merge_bin.py
build_src_filter = +<*> -<bringup/>

[env:mks_dlc32_max_bringup]
board = ${dlc32_max.board}
board_upload.flash_size = ${dlc32_max.board_upload.flash_size}
board_build.flash_size = ${dlc32_max.board_build.flash_size}
board_build.arduino.memory_type = ${dlc32_max.board_build.arduino.memory_type}
board_build.partitions = partitions_8mb.csv
build_flags = ${dlc32_max.build_flags}
build_src_filter = +<bringup/>
monitor_speed = 115200
